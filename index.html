<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments" id="list">
      <li class="comment">
        <div class="comment-header">
          <div>Глеб Фокин</div>
          <div>12.02.22 12:18</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Это будет первый комментарий на этой странице
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">3</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
      <li class="comment">
        <div class="comment-header">
          <div>Варвара Н.</div>
          <div>13.02.22 19:22</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            Мне нравится как оформлена эта страница! ❤
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">75</span>
            <button class="like-button -active-like"></button>
          </div>
        </div>
      </li>
    </ul>
    <div class="add-form">
      <input type="text" class="add-form-name" id="form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" id="form-comment" placeholder="Введите ваш коментарий"
        rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="button-submit" type="button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  function getFormattedDate() {
    const now = new Date();
    const pad = num => String(num).padStart(2, '0');
    const day = pad(now.getDate());
    const month = pad(now.getMonth() + 1);
    const year = now.getFullYear().toString().slice(-2);
    const hours = pad(now.getHours());
    const minutes = pad(now.getMinutes());
    return `${day}.${month}.${year} ${hours}:${minutes}`;
  }

  const formNameEl = document.getElementById(`form-name`);
  const formCommentEl = document.getElementById(`form-comment`);
  const buttonSubmitEl = document.getElementById(`button-submit`);
  const ListNameEl = document.getElementById(`list`);

  buttonSubmitEl.addEventListener('click', (e) => {

    const name = formNameEl.value.trim();
    const text = formCommentEl.value.trim();

    if (!name || !text) {
      alert('Заполните оба поля');
      return;
    }

    const oldHtml = ListNameEl.innerHTML;
    ListNameEl.innerHTML = oldHtml +
      `
        <li class="comment">
          <div class="comment-header">
            <div>${name}</div>
            <div>${getFormattedDate()}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter" id= "like-counter">3</span>
              <button class="like-button" id= "like-plus"></button>
            </div>
          </div>
        </li>
      `;

    const likeCounterEl = document.getElementById('like-counter');
    const likePlusEl = document.getElementById('like-plus');

    let countLikes = 0;

    likeCounterEl.textContent = countLikes;

    likePlusEl.addEventListener("click", () => { likeCounterEl.innerHTML = ++countLikes });

    formNameEl.value = '';
    formCommentEl.value = '';

  });

</script>

</html>

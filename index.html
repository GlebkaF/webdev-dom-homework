<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
       
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Создаем переменную для всего списка комментариев
  const commentsList = document.querySelector('.comments');

  // Получаем элементы формы
  const nameInput = document.querySelector('.add-form-name');
  const commentInput = document.querySelector('.add-form-text');
  const addButton = document.querySelector('.add-form-button');

  // Обработчики событий на изменение полей ввода
  nameInput.addEventListener('input', () => {
    console.log('Имя изменено:', nameInput.value);
  });

  commentInput.addEventListener('input', () => {
    console.log('Комментарий изменён:', commentInput.value);
  });

  // Обработка нажатия на кнопку "Добавить"
  addButton.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const comment = commentInput.value.trim();

    if (name === '' || comment === '') {
      alert('Пожалуйста, заполните оба поля');
      return;
    }

    // Получаем текущую дату и время
    const now = new Date();
    const formattedDate = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU').slice(0, 5);

    // Шаблон нового комментария
    const newComment = `
      <li class="comment">
        <div class="comment-header">
          <div>${name}</div>
          <div>${formattedDate}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${comment}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">0</span>
            <button class="like-button"></button>
          </div>
        </div>
      </li>
    `;

    // Добавляем комментарий в список с помощью innerHTML
    commentsList.innerHTML += newComment;

    // Очищаем форму
    nameInput.value = '';
    commentInput.value = '';
  });
    console.log("It works!");
  </script>
</html>

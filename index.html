<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments" id="list">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          id="input-name"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
          id="input-text"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="button-add">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Доступ к элементам
    const nameEl = document.getElementById('input-name');
    const textEl = document.getElementById('input-text');
    const listEl = document.getElementById('list');
    const buttonEl = document.getElementById('button-add');
    const btnLike = document.querySelectorAll('.like-button');

    buttonEl.addEventListener('click', () => {
      // Удаление стилей в полях при вводе
      nameEl.addEventListener('input', () => {
        nameEl.classList.remove('error');
      });

      textEl.addEventListener('input', () => {
        textEl.classList.remove('error');
      });
      // Валидация введенных данных в полях
      if (!nameEl.value) {
        nameEl.classList.add("error");
      }
      if (!textEl.value) {
        textEl.classList.add("error");
      }
      if (!nameEl.value || !textEl.value)
      return;

      // Содержимое списка в исходном состоянии
      const listOld = listEl.innerHTML;

      // Шаблонные строки
      const userName = `<div>${nameEl.value}</div>`;
      const now = new Date();
      const day = now.toLocaleDateString("RU-ru", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit"
      });
      const time = now.toLocaleTimeString("RU-ru", {
        hour: "2-digit",
        minute:"2-digit"
      });
      const userDate = `<div>${day} ${time}</div>`;

      // Создание элементов
      const liEl = document.createElement('li');
      const divHeaderEl = document.createElement('div');
      const divBodyEl = document.createElement('div');
      const divTextEl = document.createElement('div');
      const divFooterEl = document.createElement('div');
      const divLikesEl = document.createElement('div');
      const spanEl = document.createElement('span');
      const btnEl = document.createElement('button');

      // Стилизация элементов
      liEl.classList.add('comment');
      divHeaderEl.classList.add('comment-header');
      divBodyEl.classList.add('comment-body');
      divTextEl.classList.add('comment-text');
      divFooterEl.classList.add('comment-footer');
      divLikesEl.classList.add('likes');
      spanEl.classList.add('likes-counter');
      btnEl.classList.add('like-button');

      // Вложение элементов
      liEl.append(divHeaderEl, divBodyEl, divFooterEl);
      divBodyEl.appendChild(divTextEl);
      divLikesEl.append(spanEl, btnEl);
      divFooterEl.appendChild(divLikesEl);

      // Передача данных для нового комментария
      divHeaderEl.innerHTML = userName + userDate;
      divTextEl.textContent = `${textEl.value}`

      // Добавление счетчика лайков
      let counter = 0;
      spanEl.textContent = counter;

      // Добавление нового комментария
      listEl.innerHTML = listOld + liEl.outerHTML;

    });

  </script>
</html>

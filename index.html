<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    // Код писать здесь

    //добавить комментарий
    //получить нужные элементы из DOM
    const commentsList = document.querySelector('.comments');
    const formName = document.querySelector('.add-form-name');
    const formText = document.querySelector('.add-form-text');
    const sendButton = document.querySelector('.add-form-button');

    //получить текущую дату/время, функция
    function getCurrentDate() {
      let currentDate = new Date();
      const day = String(currentDate.getDate()).padStart(2, '0');
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const year = String(currentDate.getFullYear()).slice(-2);
      const hour = String(currentDate.getHours()).padStart(2, '0');
      const min = String(currentDate.getMinutes()).padStart(2, '0');
      return (day + '.' + month + '.' + year + ' ' + hour + ':' + min);
    }

    //создать новый комментарий, функция
    function newComment() {
      //шаблон комментария
      const template = document.querySelector('.comment');

      //проверка заполненности полей
      let hasEmptyFields = false;

      if (formName.value === '') {
        formName.style.border ='2px solid red';
        hasEmptyFields = true;
      }
      if (formText.value === '') {
        formText.style.border ='2px solid red';
        hasEmptyFields = true;
      }
      if (hasEmptyFields) {
        setTimeout(() => {
          formName.style.border ='';
          formText.style.border ='';
        }, 2000);
        return;
      }

      //копировать последний комментарий
      let inputNewComment = template.cloneNode(true);

      //заменить содержимое
      inputNewComment.querySelector('.comment-header div:first-child').textContent = formName.value;
      inputNewComment.querySelector('.comment-header div:last-child').textContent = getCurrentDate();
      inputNewComment.querySelector('.comment-text').textContent = formText.value;
      inputNewComment.querySelector('.likes-counter').textContent = "0";

      //добавить комментарий в конец контейнера
      commentsList.appendChild(inputNewComment);

      //очистить поля в форме
      formName.value = '';
      formText.value = '';

      //убрать красные рамки у полей, если они были
      formName.style.border ='';
      formText.style.border ='';
    }

    //отправить комментарий кликом на кнопку
    sendButton.addEventListener('click', newComment);

    console.log("It works!");
  </script>
</html>

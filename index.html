<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
      }

      .container {
        font-family: Helvetica;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 80px;
        padding-bottom: 200px;
        background: #202020;
        min-height: 100vh;
      }

      .comments,
      .comment {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .comment,
      .add-form {
        width: 596px;
        box-sizing: border-box;
        background: radial-gradient(
          75.42% 75.42% at 50% 42.37%,
          rgba(53, 53, 53, 0) 22.92%,
          #7334ea 100%
        );
        filter: drop-shadow(0px 20px 67px rgba(0, 0, 0, 0.08));
        border-radius: 20px;
      }

      .comments {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .comment {
        padding: 48px;
      }

      .comment-header {
        font-size: 16px;
        display: flex;
        justify-content: space-between;
      }

      .comment-footer {
        display: flex;
        justify-content: flex-end;
      }

      .comment-body {
        margin-top: 32px;
        margin-bottom: 32px;
      }

      .comment-text {
        font-size: 32px;
      }

      .likes {
        display: flex;
        align-items: center;
      }

      .like-button {
        all: unset;
        cursor: pointer;
      }

      .likes-counter {
        font-size: 26px;
        margin-right: 8px;
      }

      .like-button {
        margin-left: 10px;
        background-image: url("data:image/svg+xml,%3Csvg width='22' height='20' viewBox='0 0 22 20' fill='none' xmlns='http://www.w3.org/2000/svg' %3E%3Cpath d='M11.11 16.9482L11 17.0572L10.879 16.9482C5.654 12.2507 2.2 9.14441 2.2 5.99455C2.2 3.81471 3.85 2.17984 6.05 2.17984C7.744 2.17984 9.394 3.26975 9.977 4.75204H12.023C12.606 3.26975 14.256 2.17984 15.95 2.17984C18.15 2.17984 19.8 3.81471 19.8 5.99455C19.8 9.14441 16.346 12.2507 11.11 16.9482ZM15.95 0C14.036 0 12.199 0.882834 11 2.26703C9.801 0.882834 7.964 0 6.05 0C2.662 0 0 2.6267 0 5.99455C0 10.1035 3.74 13.4714 9.405 18.5613L11 20L12.595 18.5613C18.26 13.4714 22 10.1035 22 5.99455C22 2.6267 19.338 0 15.95 0Z' fill='%23BCEC30' /%3E%3C/svg%3E");
        background-repeat: no-repeat;
        width: 22px;
        height: 22px;
        transition: transform 0.2s;
      }

      .like-button.active {
        background-image: url("data:image/svg+xml,%3Csvg width='22' height='20' viewBox='0 0 22 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15.95 0C14.036 0 12.199 0.882834 11 2.26703C9.801 0.882834 7.964 0 6.05 0C2.662 0 0 2.6267 0 5.99455C0 10.1035 3.74 13.4714 9.405 18.5613L11 20L12.595 18.5613C18.26 13.4714 22 10.1035 22 5.99455C22 2.6267 19.338 0 15.95 0Z' fill='%23BCEC30'/%3E%3C/svg%3E");
      }

      .like-button:hover {
        transform: scale(1.1);
      }

      .like-button:active {
        transform: scale(0.9);
      }

      .add-form {
        padding: 20px;
        margin-top: 48px;
        display: flex;
        flex-direction: column;
      }

      .add-form-name,
      .add-form-text {
        font-size: 16px;
        font-family: Helvetica;
        border-radius: 8px;
        border: none;
      }

      .add-form-name {
        width: 300px;
        padding: 11px 22px;
      }

      .add-form-text {
        margin-top: 12px;
        padding: 22px;
        resize: none;
      }

      .add-form-row {
        display: flex;
        justify-content: flex-end;
      }

      .add-form-button {
        margin-top: 24px;
        font-size: 24px;
        padding: 10px 20px;
        background-color: #bcec30;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .add-form-button:hover {
        opacity: 0.9;
      }

      .add-form-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Стили для валидации */
      .add-form-name.error,
      .add-form-text.error {
        border: 2px solid #ff4444;
        background-color: #fff0f0;
      }

      .error-message {
        color: #ff4444;
        font-size: 14px;
        margin-top: 8px;
        min-height: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <ul class="comments" id="commentsList"></ul>
      
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          id="nameInput"
          placeholder="Введите ваше имя">
        <textarea
          class="add-form-text"
          id="textInput"
          placeholder="Введите ваш комментарий"
          rows="4"></textarea>
        <div class="add-form-row">
          <button class="add-form-button" id="addButton">Написать</button>
        </div>
        <div class="error-message" id="errorMessage"></div>
      </div>
    </div>

    <script>
    "use strict";

    // ----- МАССИВ ДАННЫХ КОММЕНТАРИЕВ -----
    var commentsData = [
      {
        id: 1,
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likes: 3,
        isLiked: false
      },
      {
        id: 2,
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likes: 75,
        isLiked: true
      }
    ];

    // ----- DOM-ЭЛЕМЕНТЫ -----
    var commentsList = document.getElementById('commentsList');
    var nameInput = document.getElementById('nameInput');
    var textInput = document.getElementById('textInput');
    var addButton = document.getElementById('addButton');
    var errorMessage = document.getElementById('errorMessage');

    // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
    var nextId = 3;

    function getCurrentDate() {
      var now = new Date();
      var day = String(now.getDate()).padStart(2, '0');
      var month = String(now.getMonth() + 1).padStart(2, '0');
      var year = String(now.getFullYear()).slice(2);
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      return day + '.' + month + '.' + year + ' ' + hours + ':' + minutes;
    }

    // ----- РЕНДЕР-ФУНКЦИЯ (ГЛАВНАЯ) -----
    function renderComments() {
      // Очищаем список
      commentsList.innerHTML = '';

      // Проходим по массиву и создаем разметку
      for (var i = 0; i < commentsData.length; i++) {
        var comment = commentsData[i];
        
        var li = document.createElement('li');
        li.className = 'comment';
        li.dataset.id = comment.id;

        // Заголовок
        var header = document.createElement('div');
        header.className = 'comment-header';

        var nameDiv = document.createElement('div');
        nameDiv.textContent = comment.name;

        var dateDiv = document.createElement('div');
        dateDiv.textContent = comment.date;

        header.appendChild(nameDiv);
        header.appendChild(dateDiv);

        // Тело
        var body = document.createElement('div');
        body.className = 'comment-body';

        var textDiv = document.createElement('div');
        textDiv.className = 'comment-text';
        textDiv.textContent = comment.text;

        body.appendChild(textDiv);

        // Футер с лайками
        var footer = document.createElement('div');
        footer.className = 'comment-footer';

        var likes = document.createElement('div');
        likes.className = 'likes';

        var likesCounter = document.createElement('span');
        likesCounter.className = 'likes-counter';
        likesCounter.textContent = comment.likes;

        var likeButton = document.createElement('button');
        likeButton.className = 'like-button';
        
        // Критично: Используем булево значение для управления классом
        // Не используем classList.add/remove, а устанавливаем класс через className
        if (comment.isLiked) {
          likeButton.className = 'like-button active';
        } else {
          likeButton.className = 'like-button';
        }

        // Добавляем data-атрибут для идентификации
        likeButton.dataset.id = comment.id;

        likes.appendChild(likesCounter);
        likes.appendChild(likeButton);
        footer.appendChild(likes);

        // Собираем всё вместе
        li.appendChild(header);
        li.appendChild(body);
        li.appendChild(footer);

        commentsList.appendChild(li);
      }
    }

    // ----- ОБРАБОТЧИК КЛИКА ПО ЛАЙКУ (ЧЕРЕЗ ДЕЛЕГИРОВАНИЕ) -----
    commentsList.addEventListener('click', function(e) {
      var likeButton = e.target.closest('.like-button');
      if (!likeButton) return;

      var commentId = parseInt(likeButton.dataset.id, 10);
      
      // Находим комментарий в массиве по ID
      var comment = null;
      for (var i = 0; i < commentsData.length; i++) {
        if (commentsData[i].id === commentId) {
          comment = commentsData[i];
          break;
        }
      }
      
      if (!comment) return;

      // Меняем состояние лайка в массиве данных
      comment.isLiked = !comment.isLiked;
      
      // Обновляем количество лайков
      if (comment.isLiked) {
        comment.likes += 1;
      } else {
        comment.likes -= 1;
      }

      // Перерисовываем весь список
      renderComments();
    });

    // ----- ВАЛИДАЦИЯ ПОЛЕЙ -----
    function validateFields() {
      var name = nameInput.value.trim();
      var text = textInput.value.trim();
      
      nameInput.classList.remove('error');
      textInput.classList.remove('error');
      
      var isValid = true;
      var errorMsg = '';
      
      if (!name) {
        nameInput.classList.add('error');
        isValid = false;
        errorMsg = 'Пожалуйста, укажите ваше имя';
      } else if (!text) {
        textInput.classList.add('error');
        isValid = false;
        errorMsg = 'Пожалуйста, введите текст комментария';
      }
      
      errorMessage.textContent = errorMsg;
      addButton.disabled = !isValid;
      
      return isValid;
    }

    // ----- ДОБАВЛЕНИЕ НОВОГО КОММЕНТАРИЯ -----
    function addComment() {
      var name = nameInput.value.trim();
      var text = textInput.value.trim();
      
      if (!name || !text) {
        validateFields();
        return;
      }
      
      // Создаем новый объект комментария
      var newComment = {
        id: nextId++,
        name: name,
        date: getCurrentDate(),
        text: text,
        likes: 0,          // Новый комментарий с 0 лайков
        isLiked: false     // Изначально не лайкнут
      };
      
      // Добавляем в массив
      commentsData.push(newComment);
      
      // Перерисовываем список
      renderComments();
      
      // Очищаем поля
      nameInput.value = '';
      textInput.value = '';
      addButton.disabled = true;
      errorMessage.textContent = '';
      nameInput.classList.remove('error');
      textInput.classList.remove('error');
      nameInput.focus();
    }

    // ----- ОБРАБОТЧИКИ СОБЫТИЙ -----
    nameInput.addEventListener('input', validateFields);
    textInput.addEventListener('input', validateFields);
    addButton.addEventListener('click', addComment);

    nameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        textInput.focus();
      }
    });

    textInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        addComment();
      }
    });

    // ----- ИНИЦИАЛИЗАЦИЯ -----
    // Первоначальная отрисовка комментариев
    renderComments();
    validateFields();

    console.log('✅ DOM 2. События на динамических элементах');
    console.log('📌 Данные хранятся в массиве commentsData');
    console.log('📌 Рендер-функция renderComments() перерисовывает весь список');
    console.log('📌 Лайки работают через булево значение isLiked');
    console.log('📌 Изменения происходят в массиве, а не в DOM');
    </script>
  </body>
</html>

  <script>
    const button = document.getElementById("add");
    const list = document.getElementById("list");
    const inputName = document.getElementById("name");
    const inputComment = document.getElementById("comment");
    const likeButton = document.getElementById("like");

    const date = new Date();

    const comments = [
      {
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text: "Это будет первый комментарий на этой странице",
        like: 3,
        condition: false
      },
      {
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text: "Мне нравится как оформлена эта страница! ❤",
        like: 75,
        condition: false
      },
    ];
      
      const initClickLikes = () => {
        const commentsLikes = document.querySelectorAll(".like-button");

        for (const commentsLike of commentsLikes) {
          commentsLike.addEventListener("click", (event) => {
            const index = commentsLike.dataset.index;

            event.stopPropagation();
            comments[index].condition = !comments[index].condition;

            if (comments[index].condition) {
              comments[index].like++;
            } else {
              comments[index].like--;
            }

            renderComments();
          });
        }
      };

      const initClickComments = () => {
      const commentsElements = document.querySelectorAll(".comment");

      for (const commentElement of commentsElements) {
        commentElement.addEventListener("click", () => {
          const name = commentElement.dataset.name;
          const text = commentElement.dataset.text;

          inputComment.value = `> ${name}: ${text}\n`;
          inputComment.focus();
        });
      }
    };

    const renderComments = () => {
      const commentsHtml = comments
        .map((comment, index) => {
          return `<li class="comment" data-name="${comment.name}" data-text="${comment.text}">
            <div class="comment-header">
              <div>${comment.name}</div>
              <div>${comment.date}</div>
            </div>
            <div class="comment-body">
              <div class="comment-text">
                ${comment.text}
              </div>
            </div>
            <div class="comment-footer">
              <div class="likes">
                <span class="likes-counter">${comment.like}</span>
                <button class="like-button ${comment.condition ? 'active-like' : ''}" data-index="${index}"></button>
              </div>
            </div>
          </li>`;
        })
        .join("");

      list.innerHTML = commentsHtml;

      initClickLikes();
      initClickComments();
    };

    renderComments();



   

    let likesCounter = 0;

    function formatDate(date) {
      const d = new Date(date);

      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const year = String(d.getFullYear()).slice(-2);

      const hours = String(d.getHours()).padStart(2, "0");
      const minutes = String(d.getMinutes()).padStart(2, "0");

      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }



    button.addEventListener("click", () => {
      inputName.classList.remove("error");
      inputComment.classList.remove("error");
      if (inputName.value === "" || inputComment.value === "") {
        inputName.classList.add("error");
        inputComment.classList.add("error");

        return;
      }

      comments.push({name: inputName.value.replaceAll("<", "&lt;").replaceAll(">", "&gt;"), date:formatDate(new Date), text: inputComment.value.replaceAll("<", "&lt;").replaceAll(">", "&gt;"), like: likesCounter, condition: false});

      renderComments();

      //       <div class="likes">
      //         <span class="likes-counter">${likesCounter}</span>
      //         <button class="like-button -active-like"></button>
      //       </div>
      //     </div>
      //   </li>`;
      inputName.value = "";
      inputComment.value = "";
      
    });

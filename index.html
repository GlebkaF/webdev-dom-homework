<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments" id="list">
    </ul>
    <div class="add-form" id="add-form">
      <input type="text" class="add-form-name" id="form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" id="form-comment" placeholder="Введите ваш коментарий"
        rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="button-submit" type="button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>

const savedComments = localStorage.getItem('comments');
  let commentsArr = savedComments ? JSON.parse(savedComments) : [
    {
      id: 1,
      author: 'Глеб Фокин',
      date: '12.02.22 12:18',
      text: 'Это будет первый комментарий на этой странице',
      likesCount: 3,
      likedByMe: false,
    },
    {
      id: 2,
      author: 'Варвара Н.',
      date: '13.02.22 19:22',
      text: 'Мне нравится как оформлена эта страница! ❤',
      likesCount: 75,
      likedByMe: false,
    },
  ];

  function escapeHtml(str) {
    return str
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function getFormattedDate() {
    const now = new Date();
    const pad = num => String(num).padStart(2, '0');
    const day = pad(now.getDate());
    const month = pad(now.getMonth() + 1);
    const year = now.getFullYear().toString().slice(-2);
    const hours = pad(now.getHours());
    const minutes = pad(now.getMinutes());
    return `${day}.${month}.${year} ${hours}:${minutes}`;
  }

  function renderComments(container, arr) {
    container.innerHTML = '';
    arr.forEach(comment => {
      const likeButtonClass = comment.likedByMe
        ? 'like-button -active-like'
        : 'like-button';

      const li = document.createElement('li');
      li.className = 'comment';
      li.dataset.id = comment.id;

      const safeAuthor = escapeHtml(comment.author);
      let safeText = escapeHtml(comment.text);
      safeText = safeText.replace(/\n/g, '<br>');

      li.innerHTML = `
        <div class="comment-header">
          <div>${safeAuthor}</div>
          <div>${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">${safeText}</div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">${comment.likesCount}</span>
  
            <button class="${likeButtonClass}" data-id="${comment.id}" data-action="like"></button>
          </div>
        </div>
      `;
      container.appendChild(li);
    });

    localStorage.setItem('comments', JSON.stringify(arr));
  }

  const buttonSubmitEl = document.getElementById('button-submit');
  const formNameEl = document.getElementById('form-name');
  const formCommentEl = document.getElementById('form-comment');
  const listEl = document.getElementById('list');

  listEl.addEventListener('click', (e) => {
    
    if (e.target.classList.contains('like-button') || e.target.dataset.action === 'like') {
      return;
    }

    const clickedComment = e.target.closest('.comment');
    
    if (clickedComment && !e.target.closest('button')) {
      
      e.stopPropagation(); 

      const targetId = parseInt(clickedComment.dataset.id, 10);
      const commentToQuote = commentsArr.find(c => c.id === targetId);

      if (commentToQuote) {

        formCommentEl.value = '';
        
        const quotePrefix = 'ᐳ ';
        const lines = commentToQuote.text.split('\n');
        const quotedText = lines.map(line => quotePrefix + line).join('\n');        
        const finalText = `${quotePrefix + commentToQuote.author}\n${quotedText}\n\n`;

        formCommentEl.value = finalText;
        formCommentEl.focus();
      }
    }
  });

  listEl.addEventListener('click', (e) => {
    if (!e.target.classList.contains('like-button') && e.target.dataset.action !== 'like') return;

    e.stopPropagation();

    const btnElement = e.target;
    const commentId = parseInt(btnElement.dataset.id, 10);

    const comment = commentsArr.find(c => c.id === commentId);
    if (!comment) return;

    comment.likedByMe = !comment.likedByMe;
    if (comment.likedByMe) {
      comment.likesCount++;
    } else {
      comment.likesCount--;
    }

    renderComments(listEl, commentsArr);
  });

  buttonSubmitEl.addEventListener('click', () => {
    const name = formNameEl.value.trim();
    const text = formCommentEl.value.trim();

    if (!name || !text) {
      alert('Заполните оба поля');
      return;
    }

    const newComment = {
      id: Date.now(),
      author: escapeHtml(name),
      date: getFormattedDate(),
      text: escapeHtml(text),
      likesCount: 0,
      likedByMe: false,
    };

    commentsArr.push(newComment);
    renderComments(listEl, commentsArr);

    formNameEl.value = '';
    formCommentEl.value = '';
  });

  renderComments(listEl, commentsArr);

</script>

</html>

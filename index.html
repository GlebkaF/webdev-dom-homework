<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments" id="list">
    </ul>
    <div class="add-form" id="add-form">
      <input type="text" class="add-form-name" id="form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" id="form-comment" placeholder="Введите ваш коментарий"
        rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button" id="button-submit" type="button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script type="module" src="./index.js"></script>

</html>
